# =============================================================================
# Extreme Networks FabricEngine Inventory File
# =============================================================================
# Use with: ansible-playbook -i inventory.ini playbook.yml
# =============================================================================

[switches]
# The three options below are alternatives - exactly one of them should be
# active. Whichever you pick, comment out the host entries of the other two, or
# Ansible will also try to reach the hosts they name.

# Option 1: Disable certificate validation (for testing/lab with self-signed certs)
fe_sw_1 ansible_host=SWITCH_IP_ADDRESS

# Option 2: Certificate validation enabled (recommended for production)
# Uncomment the line below and comment out the line above
# Using hostname from certificate CN (mapped in /etc/hosts to SWITCH_IP_ADDRESS)
# Kept as a name automatically: the certificate at ca_path names this host and
# carries no IP address, so it is not resolved to one
#fe_sw_1 ansible_host=CommonNameOrHostname

# Option 3: DNS hostnames or FQDNs, listed directly - no ansible_host needed
# Each name is resolved to an IP address before the first request.
# Uncomment the lines below and comment out the Option 1 and Option 2 entries above
#switch_1
#switch_2
#switch_3

[switches:vars]
# -----------------------------------------------------------------------------
# Connection Type
# -----------------------------------------------------------------------------
ansible_connection=httpapi
ansible_network_os=extreme.fe.extreme_fe

# -----------------------------------------------------------------------------
# REST API Endpoint
# -----------------------------------------------------------------------------
ansible_httpapi_port=9443
ansible_httpapi_base_path=/rest/openapi

# -----------------------------------------------------------------------------
# SSL/TLS Settings
# -----------------------------------------------------------------------------
ansible_httpapi_use_ssl=true

# Option 1: Disable certificate validation (for testing/lab with self-signed certs)
ansible_httpapi_validate_certs=false

# Option 2: Enable certificate validation (recommended for production)
# Uncomment the two lines below and comment out the line above
#ansible_httpapi_validate_certs=true
#ansible_httpapi_ca_path=certs/fe_switch_cert.pem

# -----------------------------------------------------------------------------
# Hostname Resolution
# -----------------------------------------------------------------------------
# Hostnames and FQDNs are resolved to an IP address before connecting, so the
# TLS handshake carries no SNI extension (default: true). Applies to TLS
# connections only. Hosts already given as an IP are not resolved, though an
# unbracketed IPv6 literal is rewritten to its bracketed form (2001:db8::1 ->
# [2001:db8::1]), whatever this is set to, because a bare IPv6 address cannot
# sit in a request URL. Hosts whose ca_path holds their own self-signed server
# certificate and nothing else, naming them with no iPAddress SAN, keep being
# reached by name. Any other ca_path is a trust store, so the host is resolved
# like any other.
# Set to false to always connect by name; note that an affected release then
# aborts the handshake, since connecting by name is what sends SNI.
#ansible_httpapi_resolve_hostname=false

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
ansible_user=ADMIN_USER
ansible_password=PASSWORD